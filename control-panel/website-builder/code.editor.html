<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Code Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.27.0/min/vs/loader.min.js"></script>
    <style>body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    margin: 0;
    background-color: #1e1e1e; /* Dark background like VS Code */
    color: #cccccc;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    background-color: #333333;
    padding: 10px 20px;
    font-size: 1.2em;
    font-weight: 500;
    border-bottom: 1px solid #007acc; /* Accent color */
}

.container {
    display: flex;
    flex-grow: 1;
    overflow: hidden;
}

/* The editor needs a defined height/width for Monaco to work */
#editor {
    flex: 2; /* Takes up 2/3 of the space */
    min-width: 400px;
    height: 100%;
    border-right: 1px solid #444444;
}

#output {
    flex: 1; /* Takes up 1/3 of the space */
    padding: 10px;
    background-color: #252526;
    display: flex;
    flex-direction: column;
}

#output h2 {
    margin-top: 0;
    color: #007acc;
    font-size: 1.1em;
}

#console {
    flex-grow: 1;
    background-color: #1e1e1e;
    padding: 10px;
    overflow: auto;
    white-space: pre-wrap; /* Preserve formatting and wrap long lines */
    border: 1px solid #444444;
}

button {
    margin-top: 10px;
    padding: 8px 15px;
    background-color: #007acc;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 3px;
    transition: background-color 0.2s;
}

button:hover {
    background-color: #005f99;
}</style>
</head>
<body>

    <header>Simple Web Code Editor</header>

    <div class="container">
        <div id="editor"></div>

        <div id="output">
            <h2>Output</h2>
            <pre id="console"></pre>
            <button onclick="runCode()">Run Code</button>
        </div>
    </div>

    <script>
        // A variable to hold the editor instance globally
let editor;

// Configure the path for Monaco Editor modules
require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.27.0/min/vs' }});

// Initialize the editor once the loader script is ready
require(['vs/editor/editor.main'], function() {
    editor = monaco.editor.create(document.getElementById('editor'), {
        value: [
            '// Start coding here!',
            'function greet(name) {',
            '\tconsole.log("Hello, " + name + "!");',
            '}',
            'greet("World");'
        ].join('\n'),
        language: 'javascript', // Set the default language for syntax highlighting
        theme: 'vs-dark',       // Set the VS Code dark theme for aesthetics
        automaticLayout: true,  // Automatically resize the editor
        minimap: { enabled: true } // Enable the minimap on the side
    });
});


/**
 * Function to run the code in the editor
 */
function runCode() {
    // Get the current code content
    const code = editor.getValue();
    const consoleElement = document.getElementById('console');
    
    // Clear previous output
    consoleElement.textContent = 'Running...\n';

    // === Custom Console Overrides ===
    // This captures console.log output and redirects it to the #console element
    let originalConsoleLog = console.log;
    console.log = function(...args) {
        const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(' ');
        consoleElement.textContent += message + '\n';
        // You can still call the original log if you want it in the browser console too
        // originalConsoleLog.apply(console, args); 
    };
    
    // === Code Execution ===
    try {
        // Use a function constructor to run the code in an isolated scope
        new Function(code)();
    } catch (error) {
        // Display any runtime errors
        consoleElement.textContent += `\n--- ERROR ---\n${error.message}`;
    } finally {
        // Restore original console.log after execution
        console.log = originalConsoleLog;
    }
}
    </script>
</body>
</html>

# This is a basic workflow to deploy your code to a Linux server.

name: Deploy to Linux Server

# Controls when the action will run. 
# Triggers the workflow on push events but only for the "main" branch.
on:
  push:
    branches: [ main ] # Change this to the branch you want to deploy from

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "deploy"
  deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Step 1: Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Executes commands on the remote server
    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        script: |
          
          # cd ${{ secrets.PROJECT_PATH }}
          git clone git@github.com:levidoc/levidoc.co.za.git
          git pull origin main

          echo "Deployment successful!"
          # You can add more commands here, for example:
          # npm install
          # npm run build
          # sudo systemctl restart my-app.service